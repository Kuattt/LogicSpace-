name: Bug report
description: Report incorrect behavior or a crash
title: '[Bug] '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: 'Do not attach credentials or private projects. Reduce the circuit to a safe reproducible example if possible.'
  - type: input
    id: version
    attributes:
      label: LogicSpace version
      placeholder: '3.0.0'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS, Python and desktop session
      placeholder: 'Ubuntu 24.04, Python 3.12, Wayland'
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the component types, connections and simulation controls used.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and error message
    validations:
      required: true

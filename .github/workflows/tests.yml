name: Tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - name: Install GUI dependency
        run: python -m pip install -r requirements.txt
      - name: Compile and test
        run: |
          python -m py_compile *.py tests/*.py
          bash -n launch.sh install.sh
          python -m unittest discover -s tests -q
      - name: Build source archive
        run: python package_release.py --output dist/LogicSpace-3.0.0-source.zip
      - uses: actions/upload-artifact@v7
        with:
          name: logicspace-source
          path: dist/LogicSpace-3.0.0-source.zip
